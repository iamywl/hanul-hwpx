name: CI (Build & Verification)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: TypeCheck, Tests & Package Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Check
        run: npm run check

      - name: Core & MCP Tests (21 Specs)
        run: npm test

      - name: Project Build
        run: npm run build

      - name: Package VSIX Test
        run: npm run package
