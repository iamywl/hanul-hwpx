[package]
name = "hanul-desktop"
version = "0.1.0"
edition = "2021"
description = "Hanul Native Desktop App for macOS"
license = "MIT"

[dependencies]
wry = "0.57"
tao = "0.37"
tiny_http = "0.12"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
muda = "0.21"
base64 = "0.22"
url = "2.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
